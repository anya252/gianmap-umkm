
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIANMAP UMKM</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f5;
        }

        header {
            background-color: #176B50;
            color: white;
            text-align: center;
            padding: 22px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 14px;
        }

        .intro {
            padding: 15px 20px;
            text-align: center;
            color: #333;
        }

        .intro h2 {
            color: #176B50;
            margin-bottom: 5px;
        }

        .intro p {
            margin-top: 5px;
            font-size: 14px;
        }

        #map {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            border-top: 3px solid #176B50;
        }

        footer {
            background-color: #176B50;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>GIANMAP UMKM</h1>
        <p>Pemetaan Digital UMKM Kabupaten Gianyar</p>
    </header>

    <section class="intro">
        <h2>Jelajahi Potensi UMKM Gianyar</h2>
        <p>
            Temukan lokasi dan informasi UMKM di berbagai kecamatan
            di Kabupaten Gianyar.
        </p>
    </section>

    <div id="map"></div>

    <footer>
        GIANMAP UMKM | Pemetaan Potensi Ekonomi Lokal Gianyar
    </footer>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        
// Membuat peta yang berpusat di Kabupaten Gianyar
const map = L.map('map').setView([-8.54, 115.32], 12);

// Menampilkan peta Esri
L.tileLayer(
    'https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Sources: Esri, HERE, Garmin, USGS, and other contributors',
        maxZoom: 19
    }
).addTo(map);

// Data UMKM
const umkm = [
    {
        nama: "Pertenunan Setia Cap Cili",
        kecamatan: "Gianyar",
        kategori: "Kerajinan Tekstil",
        produk: "Kain tenun tradisional",
        alamat: "Gianyar, Kabupaten Gianyar, Bali",
        latitude: -8.54,
        longitude: 115.32
    }
];


// Menampilkan titik UMKM pada peta
umkm.forEach(function(data) {
    const popup = `
        <div style="width:230px; font-family:Arial,sans-serif;">

            <h3 style="
    color:#176B50;
    margin:0 0 10px;
    font-size:17px;
">
    ${data.nama}
</h3>

<img
    src="setia-cap-cili.png"
    alt="Pertenunan Setia Cap Cili"
    style="
        width:100%;
        height:140px;
        object-fit:cover;
        border-radius:8px;
        margin-bottom:10px;
    "
>

            <div style="
                background:#e5f2eb;
                color:#176B50;
                padding:6px 9px;
                border-radius:6px;
                display:inline-block;
                font-size:12px;
                font-weight:bold;
                margin-bottom:10px;
            ">
                ${data.kategori}
            </div>

            <p style="margin:5px 0;">
                <b>Kecamatan:</b> ${data.kecamatan}
            </p>

            <p style="margin:5px 0;">
                <b>Produk:</b> ${data.produk}
            </p>

            <p style="margin:5px 0;">
                <b>Alamat:</b> ${data.alamat}
            </p>

            <p style="
                font-size:11px;
                color:#777;
                margin-top:12px;
            ">
                Status: Data awal, perlu verifikasi akhir
            </p>

            <a
                href="https://www.google.com/maps/search/?api=1&query=Pertenunan+Setia+Cap+Cili+Gianyar"
                target="_blank"
                style="
                    display:block;
                    background:#176B50;
                    color:white;
                    text-align:center;
                    padding:9px;
                    border-radius:6px;
                    text-decoration:none;
                    margin-top:10px;
                "
            >
                Lihat di Google Maps
            </a>

        </div>
    `;

    L.marker([data.latitude, data.longitude])
        .addTo(map)
        .bindPopup(popup);
});


    </script>

</body>
</html>
